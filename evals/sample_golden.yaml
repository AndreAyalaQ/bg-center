# --- Lookalikes ------------------------------------------------------------

- id: lookalike-joao-diet
  category: lookalike
  language: en
  question: "Is João vegetarian?"
  expected_members: [joao]
  judge_rubric: "Says no (João is not vegetarian). Must not use Joana's vegetarian diet."

- id: lookalike-joana-dog
  category: lookalike
  language: en
  question: "What's the name of Joana's dog?"
  expected_members: [joana]
  judge_rubric: "Says Joana has no pets / no dog. Must not answer Bolacha, which is João's dog."
  must_not_contain: [Bolacha]

- id: lookalike-pipo
  category: lookalike
  language: en
  question: "Is Pipo the one who memorised the digits of pi?"
  expected_members: [tomas, rita]
  judge_rubric: "No. Pipo is Tomás; the one who memorised pi is Rita, nicknamed Pi."

# --- Stale facts -----------------------------------------------------------

- id: stale-diogo-city
