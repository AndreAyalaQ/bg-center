# Hand-written eval cases for the fictional sample group.
# Fact questions derived from frontmatter live in sample_golden.generated.yaml
# (run: python evals/generate_fact_questions.py).
#
# Fields
#   id                 unique, stable
#   category           story | cross_member | lookalike | stale_fact | follow_up |
#                      unanswerable | adversarial | injection
#   language           en | pt
#   history            earlier user turns, oldest first (follow-ups only)
#   question           the user message
#   expected_members   member ids whose chunks should be retrieved (recall@k)
#   expected_section   section the answer lives in (optional)
#   must_contain       every string must appear (case- and accent-insensitive)
#   must_contain_any   at least one string must appear
#   must_not_contain   none of these may appear
#   expect_decline     the answer must say it doesn't know
#   judge_rubric       what the LLM judge checks

# --- Stories ---------------------------------------------------------------

- id: story-porto-en
  category: story
  language: en
  question: "What happened when Rita and Tomás went to Porto?"
  expected_members: [rita, tomas, joana]
  expected_section: stories
  judge_rubric: "They went for São João in 2019, missed the last train to Lisbon, and Joana picked them up around 2am and let them sleep on her sofa."

- id: story-porto-pt
  category: story
  language: pt
  question: "Quem foi buscar a Rita e o Tomás no Porto?"
  expected_members: [joana, rita, tomas]
  expected_section: stories
  must_contain: [Joana]

- id: story-cake
  category: story
  language: en
  question: "Who ate Inês's birthday cake?"
  expected_members: [joao, ines, diogo]
  expected_section: stories
  must_contain: [Bolacha]
  judge_rubric: "Bolacha, João's dog, ate half of the chocolate cake Diogo made for Inês's 25th birthday."

- id: story-speech
  category: story
  language: pt
  question: "Quanto tempo durou o discurso do Jota no casamento?"
  expected_members: [joao, ines]
  expected_section: stories
  must_contain_any: ["11", "onze", "eleven"]

- id: story-monopoly
  category: story
  language: en
  question: "Who walked out of the Monopoly game?"
  expected_members: [diogo, rita]
  expected_section: stories
  must_contain: [Diogo]

- id: story-cat-name
  category: story
  language: en
  question: "What's the name of Rita's cat?"
  expected_members: [rita]
  must_contain: [Hipotenusa]

- id: story-ines-cats-pt
  category: story
  language: pt
  question: "Quantos gatos tem a Inês e como se chamam?"
  expected_members: [ines]
  must_contain: [Mostarda, Ketchup]

