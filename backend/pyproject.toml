[project]
name = "bg-center-backend"
version = "0.1.0"
description = "FastAPI backend for BG Center — RAG pipeline over friend-group member docs"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "openai>=1.50",
    "langchain-core>=0.3",
    "langchain-huggingface>=0.1",
    "langchain-chroma>=0.1",
    "pyjwt>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
    "pandas-stubs>=2.0",
]
# Dev/testing tools (CLAUDE.md step 9's eval dashboard, the chat test UI)
# — not part of the production FastAPI service, so kept out of the main
# dependency list.
ui = [
    "gradio>=6",
    "pandas>=2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/Query()/etc., and Gradio's Progress(), in argument
# defaults are the documented, correct idiom, not the mutable-default-
# argument bug B008 flags.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "gradio.Progress",
]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["app", "tests", "chat_ui.py", "../evals"]
mypy_path = ".."
